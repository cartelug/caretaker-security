name: Deploy Caretaker website

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'styles.css'
      - 'script.js'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Validate publishing files
        run: |
          for page in index about services operations compliance leadership careers profile contact privacy terms; do
            test -s "$page.html" || { echo "missing or empty: $page.html"; exit 1; }
          done
          test -s styles.css
          test -s script.js
          test -s CNAME
          test -s robots.txt
          test -s sitemap.xml
          node --check script.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
